<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>HuertoHogar</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contacto y Consultas</h2>
    
    <form id="formContacto">
      <div class="form-group">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
        <span id="errNombre" class="error"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.cl">
        <span id="errEmail" class="error"></span>
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje o Pedido Especial:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
        <span id="errMensaje" class="error"></span>
      </div>

      <button type="submit" class="btn">Enviar Consulta</button>
      <p id="msgExito" class="exito"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 HuertoHogar - Todos los derechos reservados.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
